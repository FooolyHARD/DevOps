name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e .
      - name: Compile backend sources
        run: python -m compileall app

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --coverage

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  sonarqube-quality-gate:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check SonarQube secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN secret is not set"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL secret is not set"; exit 1; }

      - name: Generate backend coverage
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Generate frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npm test -- --coverage

      - name: Scan with SonarQube and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-publish:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
      - sonarqube-quality-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab3' || github.ref == 'refs/heads/lab4')
    env:
      YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
      YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check registry secrets
        run: |
          test -n "$YC_SA_JSON" || { echo "YC_SA_JSON secret is not set"; exit 1; }
          test -n "$YC_REGISTRY_ID" || { echo "YC_REGISTRY_ID secret is not set"; exit 1; }

      - name: Log in to Yandex Container Registry
        run: printf '%s' "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex

      - name: Build images
        run: |
          docker build \
            -t cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:${{ github.sha }} \
            -t cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:latest \
            backend
          docker build \
            -t cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:${{ github.sha }} \
            -t cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:latest \
            frontend

      - name: Push images
        run: |
          docker push cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:${{ github.sha }}
          docker push cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:latest
          docker push cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:${{ github.sha }}
          docker push cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:latest

  gitops-deploy:
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/lab4'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lab4

      - name: Update Kubernetes image tags
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          test -n "$YC_REGISTRY_ID" || { echo "YC_REGISTRY_ID secret is not set"; exit 1; }
          sed -i "s#cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:[^[:space:]]*#cr.yandex/$YC_REGISTRY_ID/marine-toxicity-backend:${GITHUB_SHA}#" lab4/k8s/app/app.yaml
          sed -i "s#cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:[^[:space:]]*#cr.yandex/$YC_REGISTRY_ID/marine-toxicity-frontend:${GITHUB_SHA}#" lab4/k8s/app/app.yaml

      - name: Commit GitOps deployment
        run: |
          if git diff --quiet -- lab4/k8s/app/app.yaml; then
            echo "Image tags are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab4/k8s/app/app.yaml
          git commit -m "chore(lab4): deploy ${GITHUB_SHA} [skip ci]"
          git push origin lab4

  telegram-pipeline-status:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
      - sonarqube-quality-gate
      - docker-publish
      - gitops-deploy
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_TEST: ${{ needs.backend-test.result }}
          BACKEND_BUILD: ${{ needs.backend-build.result }}
          FRONTEND_TEST: ${{ needs.frontend-test.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          SONAR: ${{ needs.sonarqube-quality-gate.result }}
          DOCKER: ${{ needs.docker-publish.result }}
          GITOPS: ${{ needs.gitops-deploy.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; notification skipped"
            exit 0
          fi

          STATUS="passed"
          for result in "$BACKEND_TEST" "$BACKEND_BUILD" "$FRONTEND_TEST" "$FRONTEND_BUILD" "$SONAR" "$DOCKER" "$GITOPS"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              STATUS="failed"
            fi
          done

          MESSAGE="$(cat <<EOF
          CI/CD pipeline ${STATUS}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}

          backend-test: ${BACKEND_TEST}
          backend-build: ${BACKEND_BUILD}
          frontend-test: ${FRONTEND_TEST}
          frontend-build: ${FRONTEND_BUILD}
          sonarqube-quality-gate: ${SONAR}
          docker-publish: ${DOCKER}
          gitops-deploy: ${GITOPS}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
